[project]
name = "foraging-suitability-mapper"
version = "0.1.0"
description = "Predicts and ranks wild-foraging sites from terrain, vegetation, access and observation data."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "rasterio>=1.3",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "requests>=2.31",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "networkx>=3.2",
    "scikit-image>=0.22",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
forage = "foraging.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foraging"]
